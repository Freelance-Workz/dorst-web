# pr-goblin runner: works open issues labelled `goblin` and opens a PR into
# `staging` for each. It never merges; Vercel builds a preview of each PR and a
# human reviews it. A thin caller of pr-goblin's reusable workflow, which also
# checks out the runner code at the same commit as the pinned workflow (the
# widget vendored in vendor/pr-goblin is a separate pin, see its README).
#
# Off until the repo variable GOBLIN_ENABLED is "true" (Settings → Secrets and
# variables → Actions → Variables). Set it to anything else to stop all runs.
#
# Secrets:
#   GOBLIN_GH_TOKEN          fine-grained PAT, this repo only: Contents, Issues,
#                            Pull requests read/write. The built-in GITHUB_TOKEN
#                            is refused on purpose: its commits are authored by
#                            github-actions[bot], which Vercel won't deploy.
#   CLAUDE_CODE_OAUTH_TOKEN  the agent on a Claude subscription (`claude setup-token`)
#     or ANTHROPIC_API_KEY   pay-per-use. If both are set the API key wins.
#
# Issues get `goblin` from the partner-portal feedback widget (signed partner
# reports), or by hand from a maintainer. Reports labelled `untrusted` are held
# until a human removes the label. goblin-lock.yml locks these issues so only
# collaborators can comment: the agent reads the comments.
#
# Runs start when a goblin label is added (or `untrusted` removed), by hand, and on
# an hourly sweep that resumes paused tickets, instead of polling every 15 minutes.

name: pr-goblin

on:
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # hourly sweep; GitHub runs it a few minutes late at times

permissions:
  contents: read

jobs:
  goblin:
    if: >-
      vars.GOBLIN_ENABLED == 'true' && (
        github.event_name != 'issues' ||
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'goblin')) ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'untrusted')
      )
    # TODO: repin to the release tag after Rumi-Shamz/pr-goblin#8 merges
    uses: Rumi-Shamz/pr-goblin/.github/workflows/goblin-runner.yml@6d4685b4cd7b002e820075299626edf11312a978
    with:
      base-branch: staging
      app-id: ${{ vars.GOBLIN_APP_ID }}   # ganbare-automation-bot (Freelance-Workz org variable)
      node-version: '22'
      pnpm-version: '9'
    secrets:
      GOBLIN_APP_PRIVATE_KEY: ${{ secrets.GOBLIN_APP_PRIVATE_KEY }}   # org secret
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
